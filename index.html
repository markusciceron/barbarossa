
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARBAROSSA | Luxury Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080807;
    color: #f5e6bc;
    font-family: 'Montserrat', sans-serif;
}

.gold {
    background: linear-gradient(120deg,
    #8c641e, #f8e6a0, #c49a42, #fff1b8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

nav {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    border-bottom: 1px solid #9b782b44;
    position: relative;
    z-index: 2;
}

.logo {
    font-family: 'Cinzel', serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 5px;
}

nav a {
    color: #e6d5a8;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 3px;
    margin-left: 30px;
}

.hero {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    position: relative;
    overflow: hidden;
}

.hero::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: #b8892630;
    filter: blur(130px);
    border-radius: 50%;
    animation: glow 5s infinite alternate;
}

.hero-content {
    position: relative;
    animation: appear 2s ease;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 7px;
    color: #c5a45b;
    margin-bottom: 35px;
}

h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(48px, 9vw, 110px);
    letter-spacing: 12px;
    line-height: 1.2;
    font-weight: 500;
}

.line {
    width: 100px;
    height: 1px;
    background: #d5ae57;
    margin: 35px auto;
}

.description {
    color: #bdb39c;
    font-size: 13px;
    letter-spacing: 3px;
    line-height: 2;
}

.btn {
    display: inline-block;
    margin-top: 45px;
    padding: 17px 38px;
    border: 1px solid #c6a04c;
    color: #e7c777;
    text-decoration: none;
    letter-spacing: 4px;
    font-size: 11px;
    transition: .4s;
}

.btn:hover {
    background: #c6a04c;
    color: #080807;
    box-shadow: 0 0 35px #c6a04c55;
}

.section {
    padding: 100px 20px;
    text-align: center;
    border-top: 1px solid #9b782b33;
}

.section h2 {
    font-family: 'Cinzel', serif;
    font-size: 30px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.section p {
    color: #aaa18d;
    font-size: 13px;
    line-height: 2;
}

footer {
    padding: 35px;
    text-align: center;
    border-top: 1px solid #9b782b33;
    color: #8d805f;
    font-size: 10px;
    letter-spacing: 4px;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes glow {
    from { transform: scale(.8); opacity: .5; }
    to { transform: scale(1.3); opacity: 1; }
}

@media(max-width:600px) {
    nav { padding: 0 5%; }
    .logo { font-size: 19px; letter-spacing: 3px; }
    nav a { margin-left: 10px; font-size: 9px; }
    h1 { letter-spacing: 5px; }
    .description { letter-spacing: 1px; }
}
</style>
</head>

<body>

<nav>
    <div class="logo gold">BARBAROSSA</div>
    <div>
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
    </div>
</nav>

<section class="hero" id="home">
    <div class="hero-content">
        <div class="subtitle">THE ART OF EXCELLENCE</div>

        <h1 class="gold">BARBAROSSA</h1>

        <div class="line"></div>

        <p class="description">
            ELEGANCE IS NOT A CHOICE.<br>
            IT IS A STATEMENT.
        </p>

        <a href="#about" class="btn">DISCOVER MORE</a>
    </div>
</section>

<section class="section" id="about">
    <h2 class="gold">BEYOND ORDINARY</h2>
    <p>
        A WORLD OF ELEGANCE, STYLE AND DISTINCTION.<br>
        WELCOME TO BARBAROSSA.
    </p>
</section>

<footer>
    © 2026 BARBAROSSA — ALL RIGHTS RESERVED
</footer>

</body>
</html>
